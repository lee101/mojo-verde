[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-verde"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# The flock in the bench task keeps a concurrent factory job from landing
# on the same cores in the middle of a timing run.
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock /tmp/mojo-bench.lock python bench/bench.py"

[activation.env]
PYTHONPATH = "python"
OPENBLAS_NUM_THREADS = "8"
OMP_NUM_THREADS = "8"
MKL_NUM_THREADS = "8"

[dependencies]
mojo = "==1.2.0.dev2026092905"
max = "==26.7.0.dev2026092905"
python = "3.13.*"
pytest = "*"
numpy = "*"
verde = "*"
scipy = "*"
numba = "*"
xarray = "*"
pandas = "*"
